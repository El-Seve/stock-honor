name: Autotest del extractor (datos sinteticos)

# Comprueba que el extractor en Python (nube) da EXACTAMENTE lo mismo que el extractor local
# (Excel + C#) sobre libros sinteticos. No usa datos reales.
on:
  push:
    paths:
      - "tools/cloud/**"
      - "tests/**"
      - ".github/workflows/selftest.yml"
  pull_request:
    paths:
      - "tools/cloud/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/cloud/requirements.txt
      - name: Instalar dependencias
        run: pip install -r tools/cloud/requirements.txt
      - name: Autotest
        run: python tools/cloud/selftest.py
