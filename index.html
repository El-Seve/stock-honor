<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Stock Honor por Modelo y Punto de Venta</title>
<style>
:root{
  --bg:#f2f4f1;
  --surface:#ffffff;
  --surface-2:#eaece8;
  --ink:#1b211f;
  --muted:#5c6864;
  --line:#dde3df;
  --accent:#0e7c6b;
  --accent-ink:#ffffff;
  --accent-soft:#e1f2ee;
  --stock-high:#1e8e5a;
  --stock-mid:#b8790f;
  --stock-low:#b23b3b;
  --focus:#0e7c6b;
  --radius:10px;
  --shadow:0 1px 2px rgba(20,30,27,0.06), 0 4px 16px rgba(20,30,27,0.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12716200;
    --bg:#141816;
    --surface:#1c2220;
    --surface-2:#232a27;
    --ink:#eaeeea;
    --muted:#93a19c;
    --line:#2b332f;
    --accent:#39cbab;
    --accent-ink:#0b1a17;
    --accent-soft:#1a2f2a;
    --stock-high:#4cbf85;
    --stock-mid:#dba13a;
    --stock-low:#e2685f;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141816;
  --surface:#1c2220;
  --surface-2:#232a27;
  --ink:#eaeeea;
  --muted:#93a19c;
  --line:#2b332f;
  --accent:#39cbab;
  --accent-ink:#0b1a17;
  --accent-soft:#1a2f2a;
  --stock-high:#4cbf85;
  --stock-mid:#dba13a;
  --stock-low:#e2685f;
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
}
:root[data-theme="light"]{
  --bg:#f2f4f1;
  --surface:#ffffff;
  --surface-2:#eaece8;
  --ink:#1b211f;
  --muted:#5c6864;
  --line:#dde3df;
  --accent:#0e7c6b;
  --accent-ink:#ffffff;
  --accent-soft:#e1f2ee;
  --stock-high:#1e8e5a;
  --stock-mid:#b8790f;
  --stock-low:#b23b3b;
  --shadow:0 1px 2px rgba(20,30,27,0.06), 0 4px 16px rgba(20,30,27,0.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px;}
.tabular{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}

/* Header */
header.top{
  display:flex;flex-wrap:wrap;gap:16px;
  align-items:flex-end;justify-content:space-between;
  margin-bottom:22px;
}
.title-block h1{
  margin:0 0 4px;
  font-size:22px;
  font-weight:700;
  letter-spacing:-0.01em;
  text-wrap:balance;
}
.title-block .eyebrow{
  text-transform:uppercase;
  letter-spacing:0.08em;
  font-size:11px;
  font-weight:700;
  color:var(--accent);
  margin-bottom:6px;
}
.title-block .sub{color:var(--muted);font-size:13px;}
.snapshot-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:100px;
  padding:6px 12px;
  font-size:12.5px;
  color:var(--muted);
  white-space:nowrap;
}
.snapshot-pill b{color:var(--ink);font-weight:600;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;}

/* Stat cards */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
  margin-bottom:22px;
}
.stat{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px 16px;
  box-shadow:var(--shadow);
}
.stat .num{font-size:24px;font-weight:700;letter-spacing:-0.01em;}
.stat .label{color:var(--muted);font-size:12px;margin-top:2px;}

/* Familia chips row */
.fam-row{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  margin-bottom:14px;
}
.fam-row .fam-label{
  font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
  font-weight:700;color:var(--muted);margin-right:2px;
}
.chip-group{display:inline-flex;gap:6px;flex-wrap:wrap;}
.chip{
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--muted);
  font-size:12.5px;font-weight:600;
  padding:6px 11px;border-radius:100px;cursor:pointer;
  user-select:none;
}
.chip.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
.reset{
  font-size:12.5px;color:var(--muted);background:none;border:none;
  cursor:pointer;text-decoration:underline;padding:6px 4px;
}

/* Cascade */
.cascade{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:12px;
  margin-bottom:20px;
}
.cascade .field{display:flex;flex-direction:column;gap:5px;}
.cascade label{
  font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
  font-weight:700;color:var(--muted);
  display:flex;align-items:center;gap:6px;
}
.cascade label .step{
  display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;border-radius:50%;
  background:var(--accent-soft);color:var(--accent);
  font-size:10px;font-weight:700;flex:none;
}
.cascade select{
  width:100%;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:9px;padding:9px 12px;font-size:13.5px;font-weight:600;
  cursor:pointer;
}
.cascade select:focus{outline:2px solid var(--focus);outline-offset:1px;}
.cascade select.set{border-color:var(--accent);}

/* Results header */
.results-head{
  display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;
  margin:22px 0 10px;
}
.results-head h2{font-size:16px;margin:0;letter-spacing:-0.005em;text-wrap:balance;}
.results-head .count{color:var(--muted);font-size:12.5px;}
.export-btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer;
}
.export-btn:hover{border-color:#25D366;color:#128C4A;}
.export-btn:disabled{opacity:0.45;cursor:default;}
.export-btn:disabled:hover{border-color:var(--line);color:var(--ink);}

/* Table */
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px;}
thead th{
  position:sticky;top:0;background:var(--surface-2);
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;
  color:var(--muted);font-weight:700;
  padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;
}
thead th:hover{color:var(--ink);}
thead th.sorted{color:var(--accent);}
thead th .arrow{font-size:9px;margin-left:3px;}
tbody td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--accent-soft);}
td.num,th.num{text-align:right;}
.meter-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
.meter-track{width:56px;height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;flex:none;}
.meter-fill{height:100%;border-radius:4px;}
.qty{font-weight:700;min-width:34px;text-align:right;}
.tag{
  display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:100px;
  background:var(--surface-2);color:var(--muted);
}
.tag.fam-Moviles{background:var(--accent-soft);color:var(--accent);}
.pdv-name{font-weight:600;}
.sub-meta{color:var(--muted);font-size:11.5px;}
.cod-oracle{
  display:inline-block;margin-left:4px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:10.5px;font-weight:600;letter-spacing:0.02em;
  color:var(--accent);
  background:var(--accent-soft);
  padding:1px 6px;border-radius:5px;
  vertical-align:middle;
}

.empty-state{
  border:1px dashed var(--line);border-radius:var(--radius);
  padding:48px 20px;text-align:center;color:var(--muted);font-size:13.5px;
}
.empty-state .big{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:4px;}

footer.note{
  margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
  color:var(--muted);font-size:12px;line-height:1.6;
}
footer.note b{color:var(--ink);}

@media (max-width:640px){
  .wrap{padding:18px 14px 40px;}
  header.top{align-items:flex-start;}
  .stats{grid-template-columns:1fr 1fr;}
}
</style>
</head>

<script>
(function(){
  "use strict";
  var RAW = JSON.parse(document.getElementById('stock-data').textContent);
  var products = RAW.products, pdvs = RAW.pdvs, stock = RAW.stock;

  var ARTIFACT_URL = 'https://el-seve.github.io/stock-honor/';

  // ---------- date ----------
  var SNAPSHOT_LABEL = '—';
  (function(){
    var periodo = String(RAW.periodo), dia = RAW.dia;
    var year = periodo.slice(0,4), month = periodo.slice(4,6);
    var d = String(dia).padStart(2,'0');
    SNAPSHOT_LABEL = d+'/'+month+'/'+year;
    document.getElementById('snapshotDate').textContent = SNAPSHOT_LABEL;
  })();

  // ---------- state ----------
  var state = {
    depto: '',
    canal: '',
    pdvIdx: '',      // '' = todos, else numeric index into pdvs
    modelo: ''       // '' = todos, else modelo name
  };

  // ---------- helpers ----------
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmt(n){ return n.toLocaleString('es-PE'); }
  function tierOf(q){ return q<=2 ? 'stock-low' : (q<=9 ? 'stock-mid' : 'stock-high'); }

  // Iterate stock rows applying the selected cascade filters (controlled by opts)
  function eachRow(cb, opts){
    opts = opts || {};
    var pdvIdxNum = state.pdvIdx==='' ? -1 : +state.pdvIdx;
    for(var i=0;i<stock.length;i++){
      var row = stock[i];
      var p = products[row[0]], s = pdvs[row[1]];
      if(opts.depto && state.depto && s.departamento!==state.depto) continue;
      if(opts.canal && state.canal && s.canal!==state.canal) continue;
      if(opts.pdv && pdvIdxNum!==-1 && row[1]!==pdvIdxNum) continue;
      if(opts.modelo && state.modelo && p.modelo!==state.modelo) continue;
      cb(row, p, s);
    }
  }

  function sortEs(arr){ return arr.sort(function(a,b){return String(a).localeCompare(String(b),'es');}); }

  // ---------- cascade dropdowns ----------
  var deptoSel = document.getElementById('deptoFilter');
  var canalSel = document.getElementById('canalFilter');
  var pdvSel   = document.getElementById('pdvFilter');
  var modeloSel= document.getElementById('modeloFilter');

  function distinctDepto(){
    var set=new Set(); eachRow(function(r,p,s){ if(s.departamento) set.add(s.departamento); }, {});
    return sortEs(Array.from(set));
  }
  function distinctCanal(){
    var set=new Set(); eachRow(function(r,p,s){ if(s.canal) set.add(s.canal); }, {depto:true});
    return sortEs(Array.from(set));
  }
  function distinctPdv(){
    var set=new Set(); eachRow(function(r,p,s){ set.add(r[1]); }, {depto:true,canal:true});
    var arr = Array.from(set).map(function(idx){ return {idx:idx, label:pdvs[idx].pdv}; });
    arr.sort(function(a,b){ return a.label.localeCompare(b.label,'es'); });
    return arr;
  }
  function distinctModelo(){
    var set=new Set(); eachRow(function(r,p,s){ if(p.modelo) set.add(p.modelo); }, {depto:true,canal:true,pdv:true});
    return sortEs(Array.from(set));
  }

  function fillSelect(sel, values, selected){
    var html = '<option value="">Todos</option>';
    for(var i=0;i<values.length;i++){
      var v = values[i];
      html += '<option value="'+escapeHtml(v)+'"'+(v===selected?' selected':'')+'>'+escapeHtml(v)+'</option>';
    }
    sel.innerHTML = html;
    sel.classList.toggle('set', !!selected);
  }
  function fillPdvSelect(sel, opts, selectedIdx){
    var html = '<option value="">Todos</option>';
    for(var i=0;i<opts.length;i++){
      var o = opts[i];
      html += '<option value="'+o.idx+'"'+(String(o.idx)===String(selectedIdx)?' selected':'')+'>'+escapeHtml(o.label)+'</option>';
    }
    sel.innerHTML = html;
    sel.classList.toggle('set', selectedIdx!=='');
  }

  // Rebuild all cascade selects top-down, dropping selections that are no longer valid.
  function refreshCascade(){
    var deptos = distinctDepto();
    if(state.depto && deptos.indexOf(state.depto)===-1){ state.depto=''; state.canal=''; state.pdvIdx=''; state.modelo=''; }
    fillSelect(deptoSel, deptos, state.depto);

    var canales = distinctCanal();
    if(state.canal && canales.indexOf(state.canal)===-1){ state.canal=''; state.pdvIdx=''; state.modelo=''; }
    fillSelect(canalSel, canales, state.canal);

    var pdvOpts = distinctPdv();
    if(state.pdvIdx!=='' && !pdvOpts.some(function(o){return String(o.idx)===String(state.pdvIdx);})){ state.pdvIdx=''; state.modelo=''; }
    fillPdvSelect(pdvSel, pdvOpts, state.pdvIdx);

    var modelos = distinctModelo();
    if(state.modelo && modelos.indexOf(state.modelo)===-1){ state.modelo=''; }
    fillSelect(modeloSel, modelos, state.modelo);
  }

  deptoSel.addEventListener('change', function(e){
    state.depto = e.target.value; state.canal=''; state.pdvIdx=''; state.modelo='';
    refreshCascade(); update();
  });
  canalSel.addEventListener('change', function(e){
    state.canal = e.target.value; state.pdvIdx=''; state.modelo='';
    refreshCascade(); update();
  });
  pdvSel.addEventListener('change', function(e){
    state.pdvIdx = e.target.value; state.modelo='';
    refreshCascade(); update();
  });
  modeloSel.addEventListener('change', function(e){
    state.modelo = e.target.value;
    refreshCascade(); update();
  });

  document.getElementById('resetFilters').addEventListener('click', function(){
    state.depto=''; state.canal=''; state.pdvIdx=''; state.modelo='';
    refreshCascade(); update();
  });

  // ---------- stats ----------
  function renderStats(){
    var totalQty=0, modeloSet=new Set(), pdvSet=new Set();
    eachRow(function(row,p,s){
      totalQty += row[2]; modeloSet.add(p.modelo); pdvSet.add(row[1]);
    }, {depto:true,canal:true,pdv:true,modelo:true});
    var cards = [
      {num: fmt(totalQty), label:'Unidades disponibles'},
      {num: fmt(modeloSet.size), label:'Modelos con stock'},
      {num: fmt(pdvSet.size), label:'Puntos de venta con stock'}
    ];
    var el = document.getElementById('statsRow');
    el.innerHTML='';
    cards.forEach(function(c){
      var d=document.createElement('div'); d.className='stat';
      d.innerHTML='<div class="num tabular">'+c.num+'</div><div class="label">'+c.label+'</div>';
      el.appendChild(d);
    });
  }

  // ---------- results ----------
  var lastShare = null;
  var shareBtn = document.getElementById('shareBtn');

  function scopeTitle(){
    if(state.modelo) return state.modelo;
    if(state.pdvIdx!=='') return pdvs[+state.pdvIdx].pdv;
    if(state.canal) return (state.depto||'Todos los departamentos')+' · '+state.canal;
    if(state.depto) return state.depto;
    return 'Todos los puntos de venta';
  }

  // context lines that are NOT already the subject
  function scopeContext(){
    var ctx=[];
    if(state.modelo){
      if(state.depto) ctx.push(state.depto);
      if(state.canal) ctx.push(state.canal);
      if(state.pdvIdx!=='') ctx.push(pdvs[+state.pdvIdx].pdv);
    } else if(state.pdvIdx!==''){
      var s=pdvs[+state.pdvIdx];
      ctx.push(s.ubicacion); if(s.departamento) ctx.push(s.departamento); if(s.canal) ctx.push(s.canal);
    }
    return ctx;
  }

  function renderResults(){
    var titleEl = document.getElementById('resultsTitle');
    var countEl = document.getElementById('resultsCount');
    var area = document.getElementById('resultsArea');

    var byModelo = !state.modelo; // if no modelo selected, group by modelo; else group by PDV
    var groupsMap = new Map();
    var totalQty = 0;

    eachRow(function(row, p, s){
      var q = row[2];
      totalQty += q;
      var key, g;
      if(byModelo){
        key = p.modelo;
        if(!groupsMap.has(key)) groupsMap.set(key, {label:p.modelo, sub:p.marca, familia:p.familia, qty:0, items:new Map()});
      } else {
        key = row[1]; // sIdx
        if(!groupsMap.has(key)) groupsMap.set(key, {label:s.pdv, sub:s.ubicacion+' · '+s.departamento+' · '+s.canal, familia:null, qty:0, items:new Map()});
      }
      g = groupsMap.get(key);
      g.qty += q;
      // aggregate SKU breakdown by producto (sum across PDVs/rows), keeping the Oracle code
      var it = g.items.get(p.producto);
      if(it) it.qty += q;
      else g.items.set(p.producto, {qty:q, cod:p.codOracle||''});
    }, {depto:true,canal:true,pdv:true,modelo:true});

    var groups = Array.from(groupsMap.values());
    groups.forEach(function(g){
      g.items = Array.from(g.items.entries())
        .map(function(e){ return {producto:e[0], qty:e[1].qty, cod:e[1].cod}; })
        .sort(function(a,b){ return b.qty - a.qty; });
    });
    groups.sort(function(a,b){ return b.qty - a.qty; });

    titleEl.textContent = scopeTitle();
    var ctxParts = scopeContext();
    var unitWord = byModelo ? ('modelo'+(groups.length===1?'':'s')) : ('punto'+(groups.length===1?'':'s')+' de venta');
    countEl.textContent = fmt(totalQty)+' u. en '+groups.length+' '+unitWord + (ctxParts.length?(' · '+ctxParts.join(' · ')):'');

    if(groups.length===0){
      area.innerHTML = '<div class="empty-state"><div class="big">Sin stock disponible</div>No hay unidades con los filtros seleccionados. Prueba ampliando la selecci&oacute;n.</div>';
      lastShare=null; shareBtn.disabled=true; return;
    }

    var maxQty = groups.reduce(function(m,g){return Math.max(m,g.qty);},1);
    var colHead = byModelo ? 'Modelo' : 'Punto de venta';
    var html = '<table><thead><tr><th>'+colHead+'</th><th class="num">Stock</th></tr></thead><tbody>';
    groups.forEach(function(g){
      var tier = tierOf(g.qty);
      var pct = Math.max(6, Math.round(g.qty/maxQty*100));
      html += '<tr><td><div class="pdv-name">'+escapeHtml(g.label)+'</div><div class="sub-meta">'+escapeHtml(g.sub||'')+'</div></td>'+
              '<td class="num"><div class="meter-cell"><span class="qty tabular" style="color:var(--'+tier+')">'+fmt(g.qty)+'</span>'+
              '<div class="meter-track"><div class="meter-fill" style="width:'+pct+'%;background:var(--'+tier+')"></div></div></div></td></tr>';
      g.items.forEach(function(it){
        var codHtml = it.cod ? ' <span class="cod-oracle">'+escapeHtml(it.cod)+'</span>' : '';
        html += '<tr><td style="padding-left:28px;"><span class="sub-meta">'+escapeHtml(it.producto)+'</span>'+codHtml+'</td><td class="num"><span class="sub-meta tabular">'+fmt(it.qty)+'</span></td></tr>';
      });
    });
    html += '</tbody></table>';
    area.innerHTML = '<div class="table-scroll">'+html+'</div>';

    // Detail lines for the WhatsApp message:
    //  - if a modelo is selected -> its SKU breakdown (productos) aggregated over the scope
    //  - otherwise -> the group rows (modelos o PDVs) con su total
    // Con un modelo o un PDV específico, el mensaje baja a nivel producto (SKU)
    // con su código Oracle. En vistas amplias (sin PDV ni modelo) lista los
    // modelos, que no tienen un código Oracle único por fila.
    var shareItems;
    if(state.modelo || state.pdvIdx!==''){
      var skuMap = new Map();
      groups.forEach(function(g){ g.items.forEach(function(it){
        var e = skuMap.get(it.producto);
        if(e) e.qty += it.qty; else skuMap.set(it.producto, {qty:it.qty, cod:it.cod||''});
      }); });
      shareItems = Array.from(skuMap.entries())
        .map(function(e){ return {label:e[0], qty:e[1].qty, cod:e[1].cod}; })
        .sort(function(a,b){ return b.qty - a.qty; });
    } else {
      shareItems = groups.map(function(g){ return {label:g.label, qty:g.qty, cod:''}; });
    }

    lastShare = {
      modelo: state.modelo,
      pdvName: state.pdvIdx!=='' ? pdvs[+state.pdvIdx].pdv : '',
      scopeTitle: scopeTitle(),
      items: shareItems
    };
    shareBtn.disabled = false;
  }

  function update(){ renderStats(); renderResults(); }

  // ---------- share to WhatsApp ----------
  shareBtn.addEventListener('click', function(){
    if(!lastShare) return;
    var MAX_LINES = 40;
    var ls = lastShare;

    // Header: Modelo y/o Punto de Venta (lo que esté seleccionado)
    var header = [];
    if(ls.modelo) header.push('Modelo: *'+ls.modelo+'*');
    if(ls.pdvName) header.push('Punto de Venta: *'+ls.pdvName+'*');
    if(header.length===0) header.push('*'+ls.scopeTitle+'*');
    header[0] = '📦 ' + header[0];

    var lines = ls.items.slice(0, MAX_LINES).map(function(it){
      var code = it.cod ? ' ['+it.cod+']' : '';
      return it.label+code+'  -->'+fmt(it.qty);
    });
    var extra = ls.items.length - lines.length;

    var msg = header.join('\n')+'\n\n';
    msg += 'Stock al '+SNAPSHOT_LABEL+'\n\n';
    msg += lines.join('\n');
    if(extra > 0) msg += '\n… y '+extra+' más';

    window.open('https://wa.me/?text='+encodeURIComponent(msg), '_blank', 'noopener');
  });

  // ---------- init ----------
  refreshCascade();
  update();
})();
</script>

</body>
