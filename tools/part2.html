</script>
<script>
(function(){
  "use strict";
  var RAW = JSON.parse(document.getElementById('stock-data').textContent);
  var products = RAW.products, pdvs = RAW.pdvs, stock = RAW.stock;

  var ARTIFACT_URL = 'https://el-seve.github.io/stock-honor/';

  // ---------- date ----------
  var SNAPSHOT_LABEL = '—';
  (function(){
    var periodo = String(RAW.periodo), dia = RAW.dia;
    var year = periodo.slice(0,4), month = periodo.slice(4,6);
    var d = String(dia).padStart(2,'0');
    SNAPSHOT_LABEL = d+'/'+month+'/'+year;
    document.getElementById('snapshotDate').textContent = SNAPSHOT_LABEL;
  })();

  // ---------- state ----------
  var state = {
    familia: '',     // '' = todas, else 'Moviles' | 'Accesorios'
    depto: '',
    canal: '',
    pdvIdx: '',      // '' = todos, else numeric index into pdvs
    modelo: ''       // '' = todos, else modelo name
  };

  // Etiqueta amigable para la familia (Moviles -> Smartphones)
  function famLabel(f){ return f==='Moviles' ? 'Smartphones' : f; }

  // ---------- helpers ----------
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmt(n){ return n.toLocaleString('es-PE'); }
  function tierOf(q){ return q<=2 ? 'stock-low' : (q<=9 ? 'stock-mid' : 'stock-high'); }

  // Iterate stock rows applying the selected cascade filters (controlled by opts)
  function eachRow(cb, opts){
    opts = opts || {};
    var pdvIdxNum = state.pdvIdx==='' ? -1 : +state.pdvIdx;
    for(var i=0;i<stock.length;i++){
      var row = stock[i];
      var p = products[row[0]], s = pdvs[row[1]];
      if(opts.familia && state.familia && p.familia!==state.familia) continue;
      if(opts.depto && state.depto && s.departamento!==state.depto) continue;
      if(opts.canal && state.canal && s.canal!==state.canal) continue;
      if(opts.pdv && pdvIdxNum!==-1 && row[1]!==pdvIdxNum) continue;
      if(opts.modelo && state.modelo && p.modelo!==state.modelo) continue;
      cb(row, p, s);
    }
  }

  function sortEs(arr){ return arr.sort(function(a,b){return String(a).localeCompare(String(b),'es');}); }

  // ---------- cascade dropdowns ----------
  var familiaSel = document.getElementById('familiaFilter');
  var deptoSel = document.getElementById('deptoFilter');
  var canalSel = document.getElementById('canalFilter');
  var pdvSel   = document.getElementById('pdvFilter');
  var modeloSel= document.getElementById('modeloFilter');

  // Cross-filter: las opciones de cada filtro se acotan por TODOS los demas
  // filtros seleccionados (no solo los de arriba). Cada distinct* aplica todos
  // los filtros MENOS el suyo propio.
  function distinctFamilia(){
    var set=new Set(); eachRow(function(r,p,s){ if(p.familia) set.add(p.familia); }, {depto:true,canal:true,pdv:true,modelo:true});
    return Array.from(set).sort(function(a,b){
      if(a==='Moviles') return -1; if(b==='Moviles') return 1;
      return a.localeCompare(b,'es');
    });
  }
  function distinctDepto(){
    var set=new Set(); eachRow(function(r,p,s){ if(s.departamento) set.add(s.departamento); }, {familia:true,canal:true,pdv:true,modelo:true});
    return sortEs(Array.from(set));
  }
  function distinctCanal(){
    var set=new Set(); eachRow(function(r,p,s){ if(s.canal) set.add(s.canal); }, {familia:true,depto:true,pdv:true,modelo:true});
    return sortEs(Array.from(set));
  }
  function distinctPdv(){
    var set=new Set(); eachRow(function(r,p,s){ set.add(r[1]); }, {familia:true,depto:true,canal:true,modelo:true});
    var arr = Array.from(set).map(function(idx){ return {idx:idx, label:pdvs[idx].pdv}; });
    arr.sort(function(a,b){ return a.label.localeCompare(b.label,'es'); });
    return arr;
  }
  function distinctModelo(){
    var set=new Set(); eachRow(function(r,p,s){ if(p.modelo) set.add(p.modelo); }, {familia:true,depto:true,canal:true,pdv:true});
    return sortEs(Array.from(set));
  }

  // Familia select: el valor es la familia real, la etiqueta es amigable.
  // Si la selección actual quedó sin datos (por otros filtros), se conserva igual.
  function fillFamiliaSelect(){
    var vals = distinctFamilia();
    if(state.familia && vals.indexOf(state.familia)===-1) vals = [state.familia].concat(vals);
    var html = '<option value="">Todas</option>';
    for(var i=0;i<vals.length;i++){
      var v = vals[i];
      html += '<option value="'+escapeHtml(v)+'"'+(v===state.familia?' selected':'')+'>'+escapeHtml(famLabel(v))+'</option>';
    }
    familiaSel.innerHTML = html;
    familiaSel.classList.toggle('set', !!state.familia);
  }

  function fillSelect(sel, values, selected){
    var vals = values.slice();
    if(selected && vals.indexOf(selected)===-1) vals = [selected].concat(vals); // conservar selección sin datos
    var html = '<option value="">Todos</option>';
    for(var i=0;i<vals.length;i++){
      var v = vals[i];
      html += '<option value="'+escapeHtml(v)+'"'+(v===selected?' selected':'')+'>'+escapeHtml(v)+'</option>';
    }
    sel.innerHTML = html;
    sel.classList.toggle('set', !!selected);
  }
  function fillPdvSelect(sel, opts, selectedIdx){
    var list = opts.slice();
    if(selectedIdx!=='' && !list.some(function(o){return String(o.idx)===String(selectedIdx);})){
      list = [{idx:+selectedIdx, label:pdvs[+selectedIdx].pdv}].concat(list); // conservar PDV sin datos
    }
    var html = '<option value="">Todos</option>';
    for(var i=0;i<list.length;i++){
      var o = list[i];
      html += '<option value="'+o.idx+'"'+(String(o.idx)===String(selectedIdx)?' selected':'')+'>'+escapeHtml(o.label)+'</option>';
    }
    sel.innerHTML = html;
    sel.classList.toggle('set', selectedIdx!=='');
  }

  // Reconstruye TODOS los selects con opciones cross-filter, conservando cada
  // selección (cualquier orden, sin borrar los demás filtros).
  function refreshCascade(){
    fillFamiliaSelect();
    fillSelect(deptoSel, distinctDepto(), state.depto);
    fillSelect(canalSel, distinctCanal(), state.canal);
    fillPdvSelect(pdvSel, distinctPdv(), state.pdvIdx);
    fillSelect(modeloSel, distinctModelo(), state.modelo);
  }

  // Al cambiar un filtro NO se borran los demás; solo se re-acotan las listas.
  familiaSel.addEventListener('change', function(e){ state.familia = e.target.value; refreshCascade(); update(); });
  deptoSel.addEventListener('change',   function(e){ state.depto   = e.target.value; refreshCascade(); update(); });
  canalSel.addEventListener('change',   function(e){ state.canal   = e.target.value; refreshCascade(); update(); });
  pdvSel.addEventListener('change',     function(e){ state.pdvIdx  = e.target.value; refreshCascade(); update(); });
  modeloSel.addEventListener('change',  function(e){ state.modelo  = e.target.value; refreshCascade(); update(); });

  document.getElementById('resetFilters').addEventListener('click', function(){
    state.familia=''; state.depto=''; state.canal=''; state.pdvIdx=''; state.modelo='';
    refreshCascade(); update();
  });

  // ---------- stats ----------
  function renderStats(){
    var totalQty=0, modeloSet=new Set(), pdvSet=new Set();
    eachRow(function(row,p,s){
      totalQty += row[2]; modeloSet.add(p.modelo); pdvSet.add(row[1]);
    }, {familia:true,depto:true,canal:true,pdv:true,modelo:true});
    var cards = [
      {num: fmt(totalQty), label:'Unidades disponibles'},
      {num: fmt(modeloSet.size), label:'Modelos con stock'},
      {num: fmt(pdvSet.size), label:'Puntos de venta con stock'}
    ];
    var el = document.getElementById('statsRow');
    el.innerHTML='';
    cards.forEach(function(c){
      var d=document.createElement('div'); d.className='stat';
      d.innerHTML='<div class="num tabular">'+c.num+'</div><div class="label">'+c.label+'</div>';
      el.appendChild(d);
    });
  }

  // ---------- results ----------
  var lastShare = null;
  var shareBtn = document.getElementById('shareBtn');

  function scopeTitle(){
    if(state.modelo) return state.modelo;
    if(state.pdvIdx!=='') return pdvs[+state.pdvIdx].pdv;
    if(state.canal) return (state.depto||'Todos los departamentos')+' · '+state.canal;
    if(state.depto) return state.depto;
    if(state.familia) return famLabel(state.familia)+' — todos los PDV';
    return 'Todos los puntos de venta';
  }

  // context lines that are NOT already the subject
  function scopeContext(){
    var ctx=[];
    // la familia se muestra como contexto solo si hay un subject mas especifico
    if(state.familia && (state.depto || state.canal || state.pdvIdx!=='' || state.modelo)) ctx.push(famLabel(state.familia));
    if(state.modelo){
      if(state.depto) ctx.push(state.depto);
      if(state.canal) ctx.push(state.canal);
      if(state.pdvIdx!=='') ctx.push(pdvs[+state.pdvIdx].pdv);
    } else if(state.pdvIdx!==''){
      var s=pdvs[+state.pdvIdx];
      ctx.push(s.ubicacion); if(s.departamento) ctx.push(s.departamento); if(s.canal) ctx.push(s.canal);
    }
    return ctx;
  }

  function renderResults(){
    var titleEl = document.getElementById('resultsTitle');
    var countEl = document.getElementById('resultsCount');
    var area = document.getElementById('resultsArea');

    var byModelo = !state.modelo; // if no modelo selected, group by modelo; else group by PDV
    var groupsMap = new Map();
    var totalQty = 0;

    eachRow(function(row, p, s){
      var q = row[2];
      totalQty += q;
      var key, g;
      if(byModelo){
        key = p.modelo;
        if(!groupsMap.has(key)) groupsMap.set(key, {label:p.modelo, sub:p.marca, familia:p.familia, qty:0, items:new Map()});
      } else {
        key = row[1]; // sIdx
        if(!groupsMap.has(key)) groupsMap.set(key, {label:s.pdv, sub:s.ubicacion+' · '+s.departamento+' · '+s.canal, familia:null, qty:0, items:new Map()});
      }
      g = groupsMap.get(key);
      g.qty += q;
      // aggregate SKU breakdown by producto (sum across PDVs/rows), keeping the Oracle code
      var it = g.items.get(p.producto);
      if(it) it.qty += q;
      else g.items.set(p.producto, {qty:q, cod:p.codOracle||''});
    }, {familia:true,depto:true,canal:true,pdv:true,modelo:true});

    var groups = Array.from(groupsMap.values());
    groups.forEach(function(g){
      g.items = Array.from(g.items.entries())
        .map(function(e){ return {producto:e[0], qty:e[1].qty, cod:e[1].cod}; })
        .sort(function(a,b){ return b.qty - a.qty; });
    });
    groups.sort(function(a,b){ return b.qty - a.qty; });

    titleEl.textContent = scopeTitle();
    var ctxParts = scopeContext();
    var unitWord = byModelo ? ('modelo'+(groups.length===1?'':'s')) : ('punto'+(groups.length===1?'':'s')+' de venta');
    countEl.textContent = fmt(totalQty)+' u. en '+groups.length+' '+unitWord + (ctxParts.length?(' · '+ctxParts.join(' · ')):'');

    if(groups.length===0){
      area.innerHTML = '<div class="empty-state"><div class="big">Sin stock con esta combinaci&oacute;n</div>Ninguna combinaci&oacute;n de los filtros actuales tiene stock. Cambia o limpia alg&uacute;n filtro (ninguno se borra solo).</div>';
      lastShare=null; shareBtn.disabled=true; return;
    }

    var maxQty = groups.reduce(function(m,g){return Math.max(m,g.qty);},1);
    var colHead = byModelo ? 'Modelo' : 'Punto de venta';
    var html = '<table><thead><tr><th>'+colHead+'</th><th class="num">Stock</th></tr></thead><tbody>';
    groups.forEach(function(g){
      var tier = tierOf(g.qty);
      var pct = Math.max(6, Math.round(g.qty/maxQty*100));
      var tagHtml = (byModelo && g.familia) ? ' <span class="tag fam-'+g.familia+'">'+(g.familia==='Moviles'?'Smartphone':'Accesorio')+'</span>' : '';
      html += '<tr><td><div class="pdv-name">'+escapeHtml(g.label)+tagHtml+'</div><div class="sub-meta">'+escapeHtml(g.sub||'')+'</div></td>'+
              '<td class="num"><div class="meter-cell"><span class="qty tabular" style="color:var(--'+tier+')">'+fmt(g.qty)+'</span>'+
              '<div class="meter-track"><div class="meter-fill" style="width:'+pct+'%;background:var(--'+tier+')"></div></div></div></td></tr>';
      g.items.forEach(function(it){
        var codHtml = it.cod ? ' <span class="cod-oracle">'+escapeHtml(it.cod)+'</span>' : '';
        html += '<tr><td style="padding-left:28px;"><span class="sub-meta">'+escapeHtml(it.producto)+'</span>'+codHtml+'</td><td class="num"><span class="sub-meta tabular">'+fmt(it.qty)+'</span></td></tr>';
      });
    });
    html += '</tbody></table>';
    area.innerHTML = '<div class="table-scroll">'+html+'</div>';

    // ---- Estructura para WhatsApp: SIEMPRE organizada por Punto de Venta ----
    //  - CON modelo filtrado  -> Modelo → PDVs (cada PDV con su cantidad de ese modelo)
    //  - SIN modelo           -> PDV → SKUs (producto + código Oracle → cantidad)
    var pdvMap = new Map();
    eachRow(function(row, p, s){
      var si = row[1];
      if(!pdvMap.has(si)) pdvMap.set(si, {name:s.pdv, qty:0, skus:new Map()});
      var g = pdvMap.get(si); g.qty += row[2];
      var it = g.skus.get(p.producto);
      if(it) it.qty += row[2]; else g.skus.set(p.producto, {qty:row[2], cod:p.codOracle||''});
    }, {familia:true,depto:true,canal:true,pdv:true,modelo:true});
    var sharePdvs = Array.from(pdvMap.values()).map(function(g){
      g.skus = Array.from(g.skus.entries())
        .map(function(e){ return {producto:e[0], qty:e[1].qty, cod:e[1].cod}; })
        .sort(function(a,b){ return b.qty - a.qty; });
      return g;
    }).sort(function(a,b){ return b.qty - a.qty; });

    lastShare = { modelo: state.modelo, ctx: shareHeaderCtx(), pdvs: sharePdvs };
    shareBtn.disabled = false;
  }

  // Filtros de contexto para el encabezado del mensaje (los que NO son el nivel
  // de agrupación: Modelo va como título 📱 y el PDV como bloque 🏪).
  function shareHeaderCtx(){
    var c=[];
    if(state.familia) c.push(famLabel(state.familia));
    if(state.depto) c.push(state.depto);
    if(state.canal) c.push(state.canal);
    return c;
  }

  function update(){ renderStats(); renderResults(); }

  // ---------- share to WhatsApp ----------
  // Emojis como secuencias de escape Unicode (ASCII en el fuente) para que
  // ninguna codificacion los corrompa al generar/servir el archivo.
  var EM_BOX   = String.fromCodePoint(0x1F4E6); // paquete
  var EM_PHONE = String.fromCodePoint(0x1F4F1); // celular
  var EM_STORE = String.fromCodePoint(0x1F3EA); // tienda
  // Estructura dinamica, siempre organizada a partir del Punto de Venta:
  //   CON modelo filtrado -> Modelo, luego PDV --> cantidad, con SKUs
  //   SIN modelo          -> PDV, luego lineas de SKU (producto [codigo] --> cantidad)
  shareBtn.addEventListener('click', function(){
    if(!lastShare) return;
    var ls = lastShare;

    var msg = EM_BOX + ' *Stock Honor*' + (ls.ctx.length ? ' - '+ls.ctx.join(' · ') : '') + '\n';
    msg += 'Corte ' + SNAPSHOT_LABEL + '\n';

    if(ls.modelo){
      // Modo A: Modelo -> PDV (total) -> SKUs con codigo
      msg += '\n' + EM_PHONE + ' *' + ls.modelo + '*\n';
      ls.pdvs.forEach(function(g){
        msg += EM_STORE + ' ' + g.name + '  -->' + fmt(g.qty) + '\n';
        g.skus.forEach(function(it){
          var code = it.cod ? ' [' + it.cod + ']' : '';
          msg += '   ' + it.producto + code + '  -->' + fmt(it.qty) + '\n';
        });
      });
    } else {
      // Modo B: PDV -> SKUs
      ls.pdvs.forEach(function(g){
        msg += '\n' + EM_STORE + ' *' + g.name + '*\n';
        g.skus.forEach(function(it){
          var code = it.cod ? ' [' + it.cod + ']' : '';
          msg += it.producto + code + '  -->' + fmt(it.qty) + '\n';
        });
      });
    }

    window.open('https://wa.me/?text=' + encodeURIComponent(msg.trim()), '_blank', 'noopener');
  });

  // ============================================================
  // ===== Cobertura por PDV: TODOS los puntos de venta Honor  =====
  // ===== (incluye los que hoy no tienen stock) y que modelos  =====
  // ===== del catalogo completo (55) les falta.                =====
  // ============================================================
  var covModels = RAW.coverage.models;   // [{modelo, familia}] en orden fijo
  var covPdvs = RAW.coverage.pdvs;       // [{pdv, ubicacion, departamento, canal, estadoPdv, have:[modelIdx,...]}]
  var covState = { search:'', depto:'', canal:'', estado:'', sort:'worst' };

  var covSearchEl  = document.getElementById('covSearch');
  var covDeptoEl   = document.getElementById('covDeptoFilter');
  var covCanalEl   = document.getElementById('covCanalFilter');
  var covEstadoEl  = document.getElementById('covEstadoFilter');
  var covSortWorstBtn = document.getElementById('covSortWorstBtn');
  var covSortAzBtn    = document.getElementById('covSortAzBtn');

  // Cross-filter tambien aqui: cada select se acota por los demas filtros
  // (menos el propio), sin borrar la seleccion actual.
  function covDistinct(field, skipField){
    var set = new Set();
    covPdvs.forEach(function(p){
      if(skipField!=='depto'  && covState.depto  && p.departamento!==covState.depto) return;
      if(skipField!=='canal'  && covState.canal  && p.canal!==covState.canal) return;
      if(skipField!=='estado' && covState.estado && p.estadoPdv!==covState.estado) return;
      if(skipField!=='search' && covState.search && p.pdv.toLowerCase().indexOf(covState.search)===-1) return;
      if(p[field]) set.add(p[field]);
    });
    return Array.from(set).sort(function(a,b){ return a.localeCompare(b,'es'); });
  }

  function covFillSelect(sel, values, selected){
    var vals = values.slice();
    if(selected && vals.indexOf(selected)===-1) vals = [selected].concat(vals);
    var html = '<option value="">Todos</option>';
    vals.forEach(function(v){
      html += '<option value="'+escapeHtml(v)+'"'+(v===selected?' selected':'')+'>'+escapeHtml(v)+'</option>';
    });
    sel.innerHTML = html;
    sel.classList.toggle('set', !!selected);
  }

  function covRefreshFilters(){
    covFillSelect(covDeptoEl, covDistinct('departamento','depto'), covState.depto);
    covFillSelect(covCanalEl, covDistinct('canal','canal'), covState.canal);
    covEstadoEl.classList.toggle('set', !!covState.estado);
    covSearchEl.classList.toggle('set', !!covState.search);
  }

  covSearchEl.addEventListener('input', function(e){ covState.search = e.target.value.trim().toLowerCase(); covRefreshFilters(); covUpdate(); });
  covDeptoEl.addEventListener('change', function(e){ covState.depto = e.target.value; covRefreshFilters(); covUpdate(); });
  covCanalEl.addEventListener('change', function(e){ covState.canal = e.target.value; covRefreshFilters(); covUpdate(); });
  covEstadoEl.addEventListener('change', function(e){ covState.estado = e.target.value; covRefreshFilters(); covUpdate(); });
  document.getElementById('covResetFilters').addEventListener('click', function(){
    covState.search=''; covState.depto=''; covState.canal=''; covState.estado='';
    covSearchEl.value=''; covEstadoEl.value='';
    covRefreshFilters(); covUpdate();
  });
  covSortWorstBtn.addEventListener('click', function(){
    covState.sort='worst'; covSortWorstBtn.classList.add('active'); covSortAzBtn.classList.remove('active'); covRenderResults();
  });
  covSortAzBtn.addEventListener('click', function(){
    covState.sort='az'; covSortAzBtn.classList.add('active'); covSortWorstBtn.classList.remove('active'); covRenderResults();
  });

  function covFilteredList(){
    return covPdvs.filter(function(p){
      if(covState.depto && p.departamento!==covState.depto) return false;
      if(covState.canal && p.canal!==covState.canal) return false;
      if(covState.estado && p.estadoPdv!==covState.estado) return false;
      if(covState.search && p.pdv.toLowerCase().indexOf(covState.search)===-1) return false;
      return true;
    });
  }

  function covRenderStats(){
    var list = covFilteredList();
    var totalModels = covModels.length;
    var zero = list.filter(function(p){ return p.have.length===0; }).length;
    var avg = list.length ? (list.reduce(function(a,p){ return a+p.have.length; },0)/list.length) : 0;
    var cards = [
      {num: fmt(list.length), label:'Puntos de venta (universo)'},
      {num: fmt(zero), label:'PDV con 0 modelos Honor'},
      {num: avg.toFixed(1)+' / '+totalModels, label:'Promedio de modelos por PDV'}
    ];
    var el = document.getElementById('covStatsRow');
    el.innerHTML='';
    cards.forEach(function(c){
      var d=document.createElement('div'); d.className='stat';
      d.innerHTML='<div class="num tabular">'+c.num+'</div><div class="label">'+c.label+'</div>';
      el.appendChild(d);
    });
  }

  function covRenderResults(){
    var countEl = document.getElementById('covResultsCount');
    var area = document.getElementById('covResultsArea');
    var totalModels = covModels.length;

    var list = covFilteredList().slice();
    if(covState.sort==='worst'){
      list.sort(function(a,b){ return a.have.length - b.have.length || a.pdv.localeCompare(b.pdv,'es'); });
    } else {
      list.sort(function(a,b){ return a.pdv.localeCompare(b.pdv,'es'); });
    }

    countEl.textContent = fmt(list.length)+' punto'+(list.length===1?'':'s')+' de venta';

    if(list.length===0){
      area.innerHTML = '<div class="empty-state"><div class="big">Sin puntos de venta</div>Ning&uacute;n PDV coincide con estos filtros.</div>';
      return;
    }

    var html = '<div class="table-scroll"><table><thead><tr><th>Punto de venta</th><th>Estado</th><th class="num">Cobertura</th></tr></thead><tbody>';
    list.forEach(function(p, i){
      var pct = totalModels ? Math.round(p.have.length/totalModels*100) : 0;
      var tier = pct<30 ? 'stock-low' : (pct<60 ? 'stock-mid' : 'stock-high');
      var isOp = p.estadoPdv==='OPERATIVO';
      var estChip = isOp
        ? '<span class="estado-chip op"><span class="dotc" aria-hidden="true"></span>Operativo</span>'
        : '<span class="estado-chip no-op"><span class="dotc" aria-hidden="true"></span>'+escapeHtml(p.estadoPdv||'No operativo')+'</span>';
      var rid = 'covrow'+i;
      html += '<tr class="cov-row" data-idx="'+i+'" tabindex="0" role="button" aria-expanded="false" aria-controls="'+rid+'">'+
              '<td><div class="pdv-name">'+escapeHtml(p.pdv)+'</div><div class="sub-meta">'+escapeHtml(p.ubicacion||'')+' &middot; '+escapeHtml(p.departamento||'')+' &middot; '+escapeHtml(p.canal||'')+'</div></td>'+
              '<td>'+estChip+'</td>'+
              '<td class="num"><div class="cov-bar-cell">'+
              '<svg class="cov-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>'+
              '<span class="cov-frac tabular" style="color:var(--'+tier+')">'+p.have.length+'/'+totalModels+'</span>'+
              '<div class="cov-track"><div class="cov-fill" style="width:'+Math.max(4,pct)+'%;background:var(--'+tier+')"></div></div>'+
              '</div></td></tr>'+
              '<tr class="cov-detail" id="'+rid+'" hidden><td colspan="3"></td></tr>';
    });
    html += '</tbody></table></div>';
    area.innerHTML = html;

    var rows = area.querySelectorAll('.cov-row');
    rows.forEach(function(row){
      function toggle(){
        var idx = +row.dataset.idx;
        var p = list[idx];
        var detailRow = document.getElementById('covrow'+idx);
        var wasExpanded = row.getAttribute('aria-expanded')==='true';
        // una sola fila expandida a la vez: mas facil de leer
        rows.forEach(function(r2){ r2.setAttribute('aria-expanded','false'); });
        area.querySelectorAll('.cov-detail').forEach(function(d){ d.hidden = true; });
        if(wasExpanded) return;

        row.setAttribute('aria-expanded','true');
        var haveSet = new Set(p.have);
        var missSmart = [], missAcc = [];
        covModels.forEach(function(m, mi){
          if(haveSet.has(mi)) return;
          (m.familia==='Moviles' ? missSmart : missAcc).push(m.modelo);
        });
        var html2 = '<div class="miss-groups">'+
          '<div class="miss-group"><h4>Smartphones faltantes ('+missSmart.length+')</h4>'+
          (missSmart.length ? '<div class="miss-list">'+missSmart.map(function(n){ return '<span>'+escapeHtml(n)+'</span>'; }).join('')+'</div>' : '<div class="miss-empty">Tiene todos los smartphones del cat&aacute;logo.</div>')+
          '</div>'+
          '<div class="miss-group"><h4>Accesorios faltantes ('+missAcc.length+')</h4>'+
          (missAcc.length ? '<div class="miss-list">'+missAcc.map(function(n){ return '<span>'+escapeHtml(n)+'</span>'; }).join('')+'</div>' : '<div class="miss-empty">Tiene todos los accesorios del cat&aacute;logo.</div>')+
          '</div></div>';
        detailRow.querySelector('td').innerHTML = html2;
        detailRow.hidden = false;
      }
      row.addEventListener('click', toggle);
      row.addEventListener('keydown', function(e){ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggle(); } });
    });
  }

  function covUpdate(){ covRenderStats(); covRenderResults(); }

  // ---------- tabs: Consulta de stock <-> Cobertura por PDV ----------
  var tabConsultaBtn = document.getElementById('tabConsultaBtn');
  var tabCoberturaBtn = document.getElementById('tabCoberturaBtn');
  var viewConsultaEl = document.getElementById('viewConsulta');
  var viewCoberturaEl = document.getElementById('viewCobertura');
  tabConsultaBtn.addEventListener('click', function(){
    tabConsultaBtn.classList.add('active'); tabConsultaBtn.setAttribute('aria-selected','true');
    tabCoberturaBtn.classList.remove('active'); tabCoberturaBtn.setAttribute('aria-selected','false');
    viewConsultaEl.hidden = false; viewCoberturaEl.hidden = true;
  });
  tabCoberturaBtn.addEventListener('click', function(){
    tabCoberturaBtn.classList.add('active'); tabCoberturaBtn.setAttribute('aria-selected','true');
    tabConsultaBtn.classList.remove('active'); tabConsultaBtn.setAttribute('aria-selected','false');
    viewConsultaEl.hidden = true; viewCoberturaEl.hidden = false;
  });

  // ---------- init ----------
  refreshCascade();
  update();
  covRefreshFilters();
  covUpdate();
})();
</script>
